name: Deploy web build to GitHub Pages

# Keeps the playable web build at https://erikm6872.github.io/animal-survival-bonanza/
# in sync with main, replacing the old local-only HTTPS server as the way to
# get the latest build onto other devices (see
# docs/wiki/Design-Decisions.md#deployment-chromebook-install).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Move export templates into place
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable

      - name: Export web build
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" "$(pwd)/build/web/index.html"

      # Renames the Godot export's output (index.html/.js/.wasm/.pck/...) to
      # include this commit's SHA, so every deploy gets a brand-new set of
      # URLs that can never collide with a stale cached copy of the previous
      # build. web/index.html (committed, barely ever changes) replaces the
      # export's own index.html as the stable entry point -- it fetches
      # manifest.json with `cache: 'no-store'` to always discover the
      # current versioned filename, then redirects there. See
      # docs/wiki/Design-Decisions.md#web-build-cache-busting.
      - name: Version the build to bust stale browser caches
        run: |
          cd build/web
          VER="${GITHUB_SHA:0:7}"
          for f in index.*; do
            mv "$f" "game-$VER${f#index}"
          done
          sed -i "s/index\./game-$VER./g; s/\"executable\":\"index\"/\"executable\":\"game-$VER\"/" "game-$VER.html"
          printf '{"version": "%s", "entry": "game-%s.html"}\n' "$VER" "$VER" > manifest.json
          cp "$GITHUB_WORKSPACE/web/index.html" index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
